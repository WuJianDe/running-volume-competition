name: Deploy to Cloudways

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  SSH_HOST: 157.230.242.227
  SSH_USER: ade14134
  REMOTE_PATH: /home/master/applications/nnbcjxmqpm/public_html/running-volume-competition/
  DB_NAME: nnbcjxmqpm
  DB_USER: nnbcjxmqpm

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_APP_BASE: /running-volume-competition/
          VITE_API_BASE_URL: /running-volume-competition/api.php

      - name: Write production config
        env:
          CONFIG_LOCAL_PHP: ${{ secrets.CONFIG_LOCAL_PHP }}
        run: |
          if [ -z "$CONFIG_LOCAL_PHP" ]; then
            echo "::error::Repository secret CONFIG_LOCAL_PHP is empty. Paste the full contents of config.local.php into it."
            exit 1
          fi
          printf '%s\n' "$CONFIG_LOCAL_PHP" > dist/config.local.php
          rm -f dist/UPLOAD_TO_CLOUDWAYS.md

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts
          printf 'Host cloudways\n  HostName %s\n  User %s\n  IdentityFile ~/.ssh/deploy_key\n  IdentitiesOnly yes\n' "$SSH_HOST" "$SSH_USER" > ~/.ssh/config

      - name: Apply database schema
        env:
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: |
          if [ -z "$DB_PASSWORD" ]; then
            echo "DB_PASSWORD secret not set; skipping schema import."
            exit 0
          fi
          # schema.sql is idempotent (CREATE TABLE IF NOT EXISTS / INSERT IGNORE)
          ssh cloudways "MYSQL_PWD='$DB_PASSWORD' mysql -u $DB_USER $DB_NAME" < backend/schema.sql

      - name: Upload files
        run: |
          ssh cloudways "mkdir -p '$REMOTE_PATH'"
          rsync -rltz --delete \
            --exclude '_database/' \
            --exclude 'config.local.php' \
            dist/ "cloudways:$REMOTE_PATH"
          # config.local.php holds secrets: upload it separately readable by the PHP user (Cloudways runs PHP as a different account than SSH)
          rsync -z dist/config.local.php "cloudways:${REMOTE_PATH}config.local.php"
          ssh cloudways "chmod 644 '${REMOTE_PATH}config.local.php'"

      - name: Smoke test
        run: |
          sleep 3
          curl --fail --silent --show-error "https://demo.adevic.dev/running-volume-competition/api-health.php"
          echo
          curl --fail --silent --show-error -o /dev/null "https://demo.adevic.dev/running-volume-competition/"
